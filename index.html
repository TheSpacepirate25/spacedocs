<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>
    <style>
        /* thanks claude for helping with the css because i dont know how to centre a div */
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(24,24,24);
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes shiftGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr; 
            grid-template-rows: repeat(3, 1fr); 
            width: 95vw;
            height: 70vh;
            align-items: center;
            justify-items: center;
        }

        .verybigtext {
            grid-column: 2;
            grid-row: 1 / span 3;
            font-size: 8vw; 
            font-weight: bold;
            text-transform: lowercase;
            white-space: nowrap;

            background: linear-gradient(
                to right, 
                rgb(100, 148, 237) 0%, 
                rgb(241, 37, 37) 50%,   
                rgb(100, 148, 237) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shiftGradient 6s linear infinite;
        }

        button {
            background-color: rgb(48, 48, 48);
            color: #181818;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 700;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 130px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #cccccc;
            transform: scale(1.05);
        }

        .left-col  { 
            grid-column: 1; 
            grid-row: 1 / span 3; 
            justify-self: end; 
            padding-right: 20px; 
            display: flex;
            flex-direction: column;
            gap: 35px;
        }
        
        .right-col { 
            grid-column: 3; 
            grid-row: 1 / span 3; 
            justify-self: start; 
            padding-left: 20px; 
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

    </style>
</head>
<body>

    <div class="grid-container">
        <!-- Left Side Buttons -->
        <div class="left-col">
            <a href="blog.html"><button>blog</button></a>
            <a href="doom.html"><button>doom</button></a>
        </div>

        <!-- Center Name -->
        <div class="verybigtext">sam skinner</div>

        <!-- Right Side Buttons -->
        <div class="right-col">
            <a href="epiclovegame.html"><button>project(s)</button></a>
            <a href="contact.html"><button>contact</button></a>
        </div>
    </div>

</body>
</html>
