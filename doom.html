
<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>New Tab</title>
		<style>
			body {
                font-family: Arial, sans-serif;
                background-color: rgb(24,24,24);
                color: white;
                text-align: center;
                margin: 0;
                padding: 20px;
                /* Flexbox helps keep everything in a neat vertical column */
                display: flex;
                flex-direction: column;
                align-items: center; 
            }

            #webretro-container {
                width: 800px;
                height: 600px;
                background-color: #000; /* Black background while loading */
                border: 4px solid #333; /* Sublte frame */
                box-shadow: 0 0 30px rgba(0,0,0,0.5);
                margin-top: 20px;
            }
		</style>
	</head>
	<body>
		<h1>DOOM</h1>
		<form action="sneshomepage.html" method="get">
            <button type="submit">Back to SNES homepage</button>
          </form>
		  <br>
		  <br>
		<div id="webretro-container"></div>
		<br>
		
		<script type="text/javascript" src="embed.js"></script>
		<script>
			var frame = webretroEmbed(document.getElementById("webretro-container"), "https://binbashbanana.github.io/webretro/", {core: "autodetect", rom: "doom.smc"});
			document.getElementById("fullscreen").onclick = function() {
				frame.requestFullscreen();
			};
		</script>
	</body>
</html>
